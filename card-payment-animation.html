<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamento na Maquininha</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #eef2f7;
      font-family: -apple-system, 'Segoe UI', sans-serif;
    }

    .scene {
      position: relative;
      width: 340px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── SVG canvas ── */
    .scene svg {
      overflow: visible;
    }

    /* shared stroke style */
    .outline {
      fill: none;
      stroke: #8faac0;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .outline-thin {
      fill: none;
      stroke: #b0c8da;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .outline-xs {
      fill: none;
      stroke: #c8dae6;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fill-white {
      fill: #fff;
      stroke: #8faac0;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fill-light {
      fill: #f5f9fc;
      stroke: #8faac0;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── POS body: static ── */
    #pos-body { }

    /* ── Card animation ── */
    #card-group {
      animation: cardMove 5s cubic-bezier(.4,0,.2,1) infinite;
      transform-origin: 170px 120px;
    }
    @keyframes cardMove {
      /* start above slot */
      0%          { transform: translateY(-90px); opacity: 0; }
      8%          { transform: translateY(-90px); opacity: 1; }
      /* slide into slot */
      22%,48%     { transform: translateY(0px);   opacity: 1; }
      /* success flash — card stays */
      58%,72%     { transform: translateY(0px);   opacity: 1; }
      /* slide out */
      88%         { transform: translateY(-90px); opacity: 1; }
      95%,100%    { transform: translateY(-90px); opacity: 0; }
    }

    /* ── Slot glow (scan line) ── */
    #slot-scan {
      animation: scanMove 5s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%,15%   { transform: translateX(0);    opacity: 0; }
      22%      { transform: translateX(0);    opacity: 1; }
      48%      { transform: translateX(80px); opacity: 1; }
      55%,100% { transform: translateX(80px); opacity: 0; }
    }

    /* ── Screen text lines ── */
    .screen-line {
      animation: lineAppear 5s ease-in-out infinite;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
    }
    .screen-line:nth-child(1) { animation-delay: 0s; }
    .screen-line:nth-child(2) { animation-delay: .15s; }
    .screen-line:nth-child(3) { animation-delay: .3s; }
    @keyframes lineAppear {
      0%,15%   { stroke-dashoffset: 60; opacity: 0; }
      25%,70%  { stroke-dashoffset: 0;  opacity: 1; }
      80%,100% { stroke-dashoffset: 0;  opacity: 0; }
    }

    /* ── Checkmark ── */
    #check-circle {
      animation: checkPop 5s ease-in-out infinite;
      transform-origin: 170px 285px;
    }
    @keyframes checkPop {
      0%,52%   { transform: scale(0); opacity: 0; }
      62%      { transform: scale(1.1); opacity: 1; }
      67%,78%  { transform: scale(1);   opacity: 1; }
      88%,100% { transform: scale(0);   opacity: 0; }
    }
    #check-path {
      stroke-dasharray: 32;
      stroke-dashoffset: 32;
      animation: drawCheck 5s ease-in-out infinite;
    }
    @keyframes drawCheck {
      0%,62%   { stroke-dashoffset: 32; }
      72%,80%  { stroke-dashoffset: 0; }
      88%,100% { stroke-dashoffset: 32; }
    }

    /* ── NFC arcs on card ── */
    .nfc-arc {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      animation: nfcDraw 5s ease-in-out infinite;
    }
    .nfc-arc:nth-child(1) { animation-delay: .4s; }
    .nfc-arc:nth-child(2) { animation-delay: .55s; }
    .nfc-arc:nth-child(3) { animation-delay: .7s; }
    @keyframes nfcDraw {
      0%,20%   { stroke-dashoffset: 20; opacity: 0; }
      30%,50%  { stroke-dashoffset: 0;  opacity: 1; }
      58%,100% { stroke-dashoffset: 0;  opacity: 0; }
    }

    /* ── Ripple rings ── */
    .ripple {
      transform-origin: 170px 285px;
      animation: rippleOut 5s ease-out infinite;
      fill: none;
      stroke: #8faac0;
      stroke-width: 1.5;
    }
    .ripple:nth-child(1) { animation-delay: 0s; }
    .ripple:nth-child(2) { animation-delay: .35s; }
    .ripple:nth-child(3) { animation-delay: .7s; }
    @keyframes rippleOut {
      0%,52%   { transform: scale(0); opacity: 0; }
      56%      { transform: scale(0); opacity: .7; }
      75%,100% { transform: scale(1.6); opacity: 0; }
    }

    /* ── Keypad keys blink ── */
    .key-ok {
      animation: keyBlink 5s ease-in-out infinite;
    }
    @keyframes keyBlink {
      0%,48%   { stroke: #8faac0; }
      55%,65%  { stroke: #5b8faa; }
      70%,100% { stroke: #8faac0; }
    }

    /* ── status dot blink ── */
    #status-dot {
      animation: dotBlink 1s ease-in-out infinite;
      fill: #8faac0;
    }
    @keyframes dotBlink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── label ── */
    .label {
      margin-top: 28px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .5px;
      color: #8faac0;
      text-transform: uppercase;
      transition: opacity .4s;
    }
  </style>
</head>
<body>

<div class="scene">
  <svg width="340" height="420" viewBox="0 0 340 420">

    <!-- ══════════════════════════════════
         POS TERMINAL (static outline)
    ══════════════════════════════════ -->

    <!-- body -->
    <rect id="pos-body" class="fill-white" x="105" y="160" width="130" height="220" rx="18" ry="18"/>

    <!-- screen area -->
    <rect class="fill-light" x="118" y="174" width="104" height="70" rx="8" ry="8"/>

    <!-- screen text lines (animated draw) -->
    <g class="outline-thin">
      <line class="screen-line" x1="128" y1="195" x2="188" y2="195"/>
      <line class="screen-line" x1="128" y1="208" x2="178" y2="208"/>
      <line class="screen-line" x1="128" y1="221" x2="195" y2="221"/>
    </g>

    <!-- status dot -->
    <circle id="status-dot" cx="209" cy="195" r="4"/>

    <!-- card slot -->
    <rect class="outline" x="118" y="255" width="104" height="10" rx="4" ry="4"/>

    <!-- slot scan line -->
    <line id="slot-scan" class="outline-thin" x1="122" y1="260" x2="122" y2="260"
          stroke="#5b8faa" stroke-width="2" stroke-linecap="round"/>

    <!-- keypad grid -->
    <!-- row 1 -->
    <rect class="outline-thin" x="118" y="276" width="28" height="22" rx="5"/>
    <rect class="outline-thin" x="152" y="276" width="28" height="22" rx="5"/>
    <rect class="outline-thin" x="186" y="276" width="28" height="22" rx="5"/>
    <!-- row 2 -->
    <rect class="outline-thin" x="118" y="304" width="28" height="22" rx="5"/>
    <rect class="outline-thin" x="152" y="304" width="28" height="22" rx="5"/>
    <rect class="outline-thin" x="186" y="304" width="28" height="22" rx="5"/>
    <!-- row 3 -->
    <rect class="outline-thin" x="118" y="332" width="28" height="22" rx="5"/>
    <rect class="outline-thin" x="152" y="332" width="28" height="22" rx="5"/>
    <rect class="outline-thin" x="186" y="332" width="28" height="22" rx="5"/>
    <!-- row 4: C | 0 | OK -->
    <rect class="outline-thin" x="118" y="360" width="28" height="22" rx="5"/>
    <rect class="outline-thin" x="152" y="360" width="28" height="22" rx="5"/>
    <rect class="key-ok outline-thin" x="186" y="360" width="28" height="22" rx="5"/>

    <!-- terminal brand line -->
    <line class="outline-xs" x1="148" y1="370" x2="192" y2="370"/>


    <!-- ══════════════════════════════════
         CREDIT CARD (animated)
    ══════════════════════════════════ -->
    <g id="card-group">
      <!-- card body -->
      <rect class="fill-white" x="110" y="72" width="120" height="76" rx="10" ry="10"/>

      <!-- chip -->
      <rect class="outline-thin" x="122" y="88" width="20" height="16" rx="3"/>
      <line class="outline-xs" x1="132" y1="88" x2="132" y2="104"/>
      <line class="outline-xs" x1="122" y1="96" x2="142" y2="96"/>

      <!-- card number dots -->
      <circle class="outline-xs" cx="122" cy="120" r="2" fill="#b0c8da"/>
      <circle class="outline-xs" cx="129" cy="120" r="2" fill="#b0c8da"/>
      <circle class="outline-xs" cx="136" cy="120" r="2" fill="#b0c8da"/>
      <circle class="outline-xs" cx="143" cy="120" r="2" fill="#b0c8da"/>
      <line class="outline-xs" x1="148" y1="120" x2="150" y2="120"/>
      <circle class="outline-xs" cx="155" cy="120" r="2" fill="#b0c8da"/>
      <circle class="outline-xs" cx="162" cy="120" r="2" fill="#b0c8da"/>
      <circle class="outline-xs" cx="169" cy="120" r="2" fill="#b0c8da"/>
      <circle class="outline-xs" cx="176" cy="120" r="2" fill="#b0c8da"/>
      <line class="outline-xs" x1="181" y1="120" x2="183" y2="120"/>
      <text x="188" y="124" font-size="7" fill="#b0c8da" font-family="monospace" letter-spacing="1">4242</text>

      <!-- name line -->
      <line class="outline-xs" x1="122" y1="134" x2="168" y2="134"/>

      <!-- NFC arcs -->
      <g fill="none" stroke="#8faac0" stroke-width="1.8" stroke-linecap="round">
        <path class="nfc-arc" d="M 204 94 A 8 8 0 0 1 204 112"/>
        <path class="nfc-arc" d="M 210 90 A 14 14 0 0 1 210 116"/>
        <path class="nfc-arc" d="M 216 86 A 20 20 0 0 1 216 120"/>
      </g>
    </g>


    <!-- ══════════════════════════════════
         RIPPLE RINGS (on success)
    ══════════════════════════════════ -->
    <circle class="ripple" cx="170" cy="285" r="30"/>
    <circle class="ripple" cx="170" cy="285" r="30"/>
    <circle class="ripple" cx="170" cy="285" r="30"/>


    <!-- ══════════════════════════════════
         SUCCESS CHECKMARK
    ══════════════════════════════════ -->
    <g id="check-circle">
      <circle class="outline" cx="170" cy="285" r="26" stroke="#5b8faa"/>
      <polyline id="check-path"
        fill="none" stroke="#5b8faa" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"
        points="158,285 166,293 182,275"/>
    </g>

  </svg>
</div>

<div class="label" id="label">Insira o cartão</div>

<script>
  const labels = ['Insira o cartão', 'Processando…', 'Pagamento aprovado!'];
  const timings = [0, 2200, 3200]; // ms into the 5000ms cycle
  const label = document.getElementById('label');

  function cycleLabel() {
    const cycle = 5000;
    const now = performance.now() % cycle;

    // find which label we should be showing
    let idx = 0;
    for (let i = 0; i < timings.length; i++) {
      if (now >= timings[i]) idx = i;
    }

    if (label.textContent !== labels[idx]) {
      label.style.opacity = '0';
      setTimeout(() => {
        label.textContent = labels[idx];
        label.style.opacity = '1';
      }, 200);
    }
    requestAnimationFrame(cycleLabel);
  }
  requestAnimationFrame(cycleLabel);
</script>
</body>
</html>
