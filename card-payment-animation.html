<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animação - Cartão na Maquininha</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── background particles ── */
    .bg {
      position: fixed; inset: 0; pointer-events: none;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(99,102,241,.15);
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* ── scene ── */
    .scene {
      position: relative;
      width: 320px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── maquininha (POS terminal) ── */
    .pos {
      position: relative;
      width: 180px;
      background: linear-gradient(160deg, #2a2a3e 0%, #1a1a2e 100%);
      border-radius: 24px 24px 30px 30px;
      box-shadow:
        0 30px 60px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.08);
      padding: 18px 16px 24px;
      z-index: 2;
    }

    /* screen */
    .pos-screen {
      background: #111827;
      border-radius: 10px;
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,.07);
    }
    .screen-text {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      color: #6366f1;
      animation: screenCycle 6s infinite;
    }
    .screen-amount {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      animation: screenCycle 6s infinite .2s;
    }
    .screen-blink {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    @keyframes screenCycle {
      0%,15%  { opacity: 0; transform: translateY(6px); }
      20%,80% { opacity: 1; transform: translateY(0); }
      85%,100%{ opacity: 0; transform: translateY(-6px); }
    }

    /* keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 14px;
    }
    .key {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 6px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: rgba(255,255,255,.4);
      cursor: default;
    }
    .key.green  { background: rgba(34,197,94,.2);  border-color: rgba(34,197,94,.3);  color: #22c55e; }
    .key.red    { background: rgba(239,68,68,.2);   border-color: rgba(239,68,68,.3);   color: #ef4444; }
    .key.yellow { background: rgba(234,179,8,.2);   border-color: rgba(234,179,8,.3);   color: #eab308; }

    /* card slot */
    .card-slot {
      margin-top: 14px;
      background: rgba(0,0,0,.4);
      border-radius: 4px;
      height: 12px;
      border: 1px solid rgba(255,255,255,.1);
      position: relative;
      overflow: hidden;
    }
    .slot-glow {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,.6), transparent);
      transform: translateX(-100%);
      animation: slotScan 6s ease-in-out infinite;
    }
    @keyframes slotScan {
      0%,30%  { transform: translateX(-100%); }
      50%     { transform: translateX(100%); }
      100%    { transform: translateX(100%); }
    }

    /* pos brand */
    .pos-brand {
      text-align: center;
      margin-top: 10px;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255,255,255,.2);
      text-transform: uppercase;
    }

    /* ── credit card ── */
    .card {
      position: absolute;
      width: 140px;
      height: 88px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      box-shadow:
        0 20px 40px rgba(99,102,241,.4),
        inset 0 1px 0 rgba(255,255,255,.2);
      z-index: 3;
      transform-origin: center bottom;
      animation: cardInsert 6s ease-in-out infinite;
      overflow: hidden;
    }

    /* card shine */
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.25) 0%, transparent 50%);
      border-radius: inherit;
    }

    .card-chip {
      position: absolute;
      top: 16px; left: 14px;
      width: 22px; height: 17px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,.2);
    }
    .card-chip::before {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(0,0,0,.15);
      border-radius: 1px;
    }

    .card-number {
      position: absolute;
      bottom: 22px; left: 14px;
      font-size: 7px;
      letter-spacing: 2px;
      color: rgba(255,255,255,.7);
      font-family: monospace;
    }
    .card-name {
      position: absolute;
      bottom: 10px; left: 14px;
      font-size: 6px;
      letter-spacing: 1px;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      font-weight: 600;
    }
    .card-logo {
      position: absolute;
      bottom: 10px; right: 14px;
      display: flex;
      gap: -4px;
    }
    .card-logo span {
      width: 16px; height: 16px;
      border-radius: 50%;
      opacity: .85;
    }
    .card-logo span:first-child { background: #ef4444; }
    .card-logo span:last-child  { background: #f97316; margin-left: -6px; }

    /* NFC wave on card */
    .nfc {
      position: absolute;
      top: 10px; right: 14px;
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .nfc-arc {
      width: 4px; height: 10px;
      border: 2px solid rgba(255,255,255,.6);
      border-left: none;
      border-radius: 0 8px 8px 0;
      animation: nfcPulse 6s ease-in-out infinite;
    }
    .nfc-arc:nth-child(2) { width: 7px; height: 15px; animation-delay: .15s; }
    .nfc-arc:nth-child(3) { width: 10px; height: 20px; animation-delay: .3s; }

    @keyframes nfcPulse {
      0%,40%,100% { opacity: 0; }
      55%,80%     { opacity: 1; }
    }

    /* card animation: hover → slide in → tap → pull out */
    @keyframes cardInsert {
      0%          { transform: translateY(-50px) rotate(-8deg); opacity: 0; }
      10%         { transform: translateY(-50px) rotate(-8deg); opacity: 1; }
      25%         { transform: translateY(0px) rotate(-3deg); }
      35%,55%     { transform: translateY(20px) rotate(0deg); }   /* inserted */
      65%         { transform: translateY(10px) rotate(0deg); }   /* slight pull */
      75%,85%     { transform: translateY(20px) rotate(0deg); }   /* re-seat */
      95%         { transform: translateY(-60px) rotate(5deg); opacity: 1; }
      100%        { transform: translateY(-60px) rotate(5deg); opacity: 0; }
    }

    /* ── success checkmark ── */
    .success-ring {
      position: absolute;
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 3px solid #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      animation: successPop 6s ease-in-out infinite;
    }
    .check {
      width: 28px; height: 28px;
      stroke: #22c55e;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: drawCheck 6s ease-in-out infinite;
    }

    @keyframes successPop {
      0%,55%       { opacity: 0; transform: scale(.6); }
      65%,80%      { opacity: 1; transform: scale(1); }
      85%,100%     { opacity: 0; transform: scale(1.2); }
    }
    @keyframes drawCheck {
      0%,55%  { stroke-dashoffset: 40; }
      70%,85% { stroke-dashoffset: 0; }
      100%    { stroke-dashoffset: 40; }
    }

    /* ── ripple on tap ── */
    .ripple {
      position: absolute;
      width: 160px; height: 160px;
      border-radius: 50%;
      border: 2px solid rgba(99,102,241,.5);
      z-index: 1;
      animation: rippleOut 6s ease-out infinite;
    }
    .ripple:nth-child(2) { animation-delay: .4s; }
    .ripple:nth-child(3) { animation-delay: .8s; }

    @keyframes rippleOut {
      0%,30%  { transform: scale(0); opacity: 0; }
      35%     { transform: scale(0); opacity: .8; }
      60%,100%{ transform: scale(1.8); opacity: 0; }
    }

    /* ── label ── */
    .label {
      margin-top: 48px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255,255,255,.4);
      text-transform: uppercase;
      animation: labelCycle 6s ease-in-out infinite;
    }

    @keyframes labelCycle {
      0%,10%   { content: ''; opacity: 0; }
      15%,35%  { opacity: 1; }
      40%,55%  { opacity: 0; }
      60%,80%  { opacity: 1; }
      85%,100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- floating particles -->
  <div class="bg" id="bg"></div>

  <!-- scene -->
  <div class="scene">
    <!-- ripples -->
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>

    <!-- credit card -->
    <div class="card" style="top: 60px; left: 90px;">
      <div class="card-chip"></div>
      <div class="nfc">
        <div class="nfc-arc"></div>
        <div class="nfc-arc"></div>
        <div class="nfc-arc"></div>
      </div>
      <div class="card-number">•••• •••• •••• 4242</div>
      <div class="card-name">João Silva</div>
      <div class="card-logo">
        <span></span><span></span>
      </div>
    </div>

    <!-- POS terminal -->
    <div class="pos">
      <div class="pos-screen">
        <div class="screen-text">INSIRA O CARTÃO</div>
        <div class="screen-amount">R$ 127,90</div>
        <div class="screen-blink"></div>
      </div>
      <div class="keypad">
        <div class="key">7</div><div class="key">8</div><div class="key">9</div>
        <div class="key">4</div><div class="key">5</div><div class="key">6</div>
        <div class="key">1</div><div class="key">2</div><div class="key">3</div>
        <div class="key red">C</div><div class="key">0</div><div class="key green">OK</div>
      </div>
      <div class="card-slot">
        <div class="slot-glow"></div>
      </div>
      <div class="pos-brand">POS TERMINAL</div>
    </div>

    <!-- success checkmark -->
    <div class="success-ring" style="top: 120px; left: 50%; transform: translateX(-50%);">
      <svg class="check" viewBox="0 0 28 28">
        <polyline points="5,14 11,20 23,8" />
      </svg>
    </div>
  </div>

  <div class="label" id="label">Aproxime ou insira o cartão</div>

  <script>
    // generate background particles
    const bg = document.getElementById('bg');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 4 + Math.random() * 12;
      Object.assign(p.style, {
        width:  size + 'px',
        height: size + 'px',
        left:   Math.random() * 100 + 'vw',
        animationDuration: (8 + Math.random() * 12) + 's',
        animationDelay:    (Math.random() * 12) + 's',
      });
      bg.appendChild(p);
    }

    // cycle label text
    const labels = [
      'Aproxime ou insira o cartão',
      'Processando pagamento…',
      'Pagamento aprovado!',
    ];
    const label = document.getElementById('label');
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % labels.length;
      label.style.opacity = '0';
      setTimeout(() => {
        label.textContent = labels[idx];
        label.style.opacity = '';
      }, 400);
    }, 2000);
  </script>
</body>
</html>
