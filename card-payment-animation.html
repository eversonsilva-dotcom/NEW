<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamento na Maquininha</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #edf2f7;
      font-family: -apple-system, 'Segoe UI', sans-serif;
    }

    .scene svg { overflow: visible; display: block; }

    /* ── shared SVG classes ── */
    .s  { fill: none; stroke: #9ab3c7; stroke-width: 3;   stroke-linecap: round; stroke-linejoin: round; }
    .sm { fill: none; stroke: #9ab3c7; stroke-width: 2;   stroke-linecap: round; stroke-linejoin: round; }
    .sx { fill: none; stroke: #b8cdd9; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* ── screen lines draw-on animation ── */
    .sline {
      stroke: #b8cdd9; stroke-width: 2.5; stroke-linecap: round;
      fill: none;
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      transition: stroke-dashoffset 0s;
    }
    .sline.draw { transition: stroke-dashoffset 0.4s cubic-bezier(0.4,0,0.2,1); stroke-dashoffset: 0; }

    /* ── NFC arcs ── */
    .narc {
      fill: none; stroke: #9ab3c7; stroke-width: 2; stroke-linecap: round;
      stroke-dasharray: 18; stroke-dashoffset: 18;
      transition: stroke-dashoffset 0s, opacity 0s;
      opacity: 0;
    }
    .narc.draw {
      transition: stroke-dashoffset 0.3s ease-out, opacity 0.2s ease-out;
      stroke-dashoffset: 0; opacity: 1;
    }

    /* ── scan line ── */
    #scan-line {
      stroke: #7aa0b8; stroke-width: 2; stroke-linecap: round;
      opacity: 0;
    }

    /* ── checkmark ── */
    #chk-circle { opacity: 0; transform-origin: 170px 330px; }
    #chk-path {
      fill: none; stroke: #7aa0b8; stroke-width: 3;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 30; stroke-dashoffset: 30;
    }

    /* ── status dot ── */
    #dot { fill: #9ab3c7; }

    /* ── ripples ── */
    .ripple {
      fill: none; stroke: #9ab3c7; stroke-width: 1.5;
      transform-origin: 170px 330px;
      opacity: 0;
    }

    /* ── label ── */
    .label {
      margin-top: 24px;
      font-size: 12px; font-weight: 500; letter-spacing: .8px;
      color: #9ab3c7; text-transform: uppercase;
      transition: opacity .35s ease;
    }
  </style>
</head>
<body>
<div class="scene">
  <!--
    SVG layout (340 × 460):
    POS body  : x=95  y=130 w=150 h=290 → bottom=420
    Screen    : x=109 y=144 w=122 h=74
    Slot      : x=109 y=230 w=122 h=11
    Keypad cols: x=117,155,193  key-w=30  gap=8
    Keypad rows: y=252,283,314,345  key-h=24  gap=7  → last bottom=369 < 420 ✓
    Card      : x=109 y=30  w=122 h=78  → in-slot translateY≈+128
  -->
  <svg id="svg" width="340" height="460" viewBox="0 0 340 460">

    <!-- ═══ LAYER 1: POS BACK (behind card) ═══ -->
    <rect class="s" x="95" y="130" width="150" height="290" rx="22"/>

    <!-- ═══ LAYER 2: CARD (animated over POS back, under POS front) ═══ -->
    <g id="card-group" style="opacity:0">
      <!-- card body -->
      <rect class="s" x="109" y="30" width="122" height="78" rx="10"/>
      <!-- chip -->
      <rect class="sm" x="122" y="46" width="22" height="17" rx="3"/>
      <line class="sx" x1="133" y1="46" x2="133" y2="63"/>
      <line class="sx" x1="122" y1="54" x2="144" y2="54"/>
      <!-- masked number dots -->
      <circle cx="122" cy="84" r="2.5" fill="#b8cdd9"/>
      <circle cx="130" cy="84" r="2.5" fill="#b8cdd9"/>
      <circle cx="138" cy="84" r="2.5" fill="#b8cdd9"/>
      <circle cx="146" cy="84" r="2.5" fill="#b8cdd9"/>
      <circle cx="157" cy="84" r="2.5" fill="#b8cdd9"/>
      <circle cx="165" cy="84" r="2.5" fill="#b8cdd9"/>
      <circle cx="173" cy="84" r="2.5" fill="#b8cdd9"/>
      <circle cx="181" cy="84" r="2.5" fill="#b8cdd9"/>
      <!-- last 4 digits -->
      <text x="191" y="88" font-size="8" fill="#b8cdd9" font-family="monospace" letter-spacing="1">4242</text>
      <!-- name underline -->
      <line class="sx" x1="122" y1="100" x2="175" y2="100"/>
      <!-- NFC arcs (right side of card) -->
      <path id="n1" class="narc" d="M 213 55 A  8  8 0 0 1 213 73"/>
      <path id="n2" class="narc" d="M 219 50 A 14 14 0 0 1 219 78"/>
      <path id="n3" class="narc" d="M 225 45 A 20 20 0 0 1 225 83"/>
    </g>

    <!-- ═══ LAYER 3: POS FRONT (drawn over card — creates "card enters slot" illusion) ═══ -->

    <!-- screen -->
    <rect class="sm" x="109" y="144" width="122" height="74" rx="8"/>
    <!-- screen lines (animated) -->
    <line id="sl1" class="sline" x1="121" y1="166" x2="209" y2="166"/>
    <line id="sl2" class="sline" x1="121" y1="181" x2="195" y2="181"/>
    <line id="sl3" class="sline" x1="121" y1="196" x2="203" y2="196"/>
    <!-- status dot -->
    <circle id="dot" cx="218" cy="166" r="4"/>

    <!-- card slot -->
    <rect class="s" x="109" y="230" width="122" height="11" rx="5"/>
    <!-- scan line inside slot -->
    <line id="scan-line" x1="113" y1="235" x2="113" y2="235"/>

    <!-- keypad: 3 cols × 4 rows, all inside POS body (bottom=369 < 420) -->
    <!-- row 1 -->
    <rect class="sm" x="117" y="252" width="30" height="24" rx="5"/>
    <rect class="sm" x="155" y="252" width="30" height="24" rx="5"/>
    <rect class="sm" x="193" y="252" width="30" height="24" rx="5"/>
    <!-- row 2 -->
    <rect class="sm" x="117" y="283" width="30" height="24" rx="5"/>
    <rect class="sm" x="155" y="283" width="30" height="24" rx="5"/>
    <rect class="sm" x="193" y="283" width="30" height="24" rx="5"/>
    <!-- row 3 -->
    <rect class="sm" x="117" y="314" width="30" height="24" rx="5"/>
    <rect class="sm" x="155" y="314" width="30" height="24" rx="5"/>
    <rect class="sm" x="193" y="314" width="30" height="24" rx="5"/>
    <!-- row 4: C | 0 | OK -->
    <rect class="sm"  x="117" y="345" width="30" height="24" rx="5"/>
    <rect class="sm"  x="155" y="345" width="30" height="24" rx="5"/>
    <rect id="ok-key" class="sm" x="193" y="345" width="30" height="24" rx="5"/>

    <!-- ═══ RIPPLES (success) ═══ -->
    <circle class="ripple" id="r1" cx="170" cy="235" r="22"/>
    <circle class="ripple" id="r2" cx="170" cy="235" r="22"/>
    <circle class="ripple" id="r3" cx="170" cy="235" r="22"/>

    <!-- ═══ CHECKMARK (success) ═══ -->
    <g id="chk-circle">
      <circle class="s" cx="170" cy="330" r="28" stroke="#7aa0b8"/>
      <polyline id="chk-path" points="158,330 166,338 182,320"
        fill="none" stroke="#7aa0b8" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  </svg>
</div>

<div class="label" id="label">Insira o cartão</div>

<script>
/* ── helpers ── */
const el  = id => document.getElementById(id);
const css = (node, obj) => Object.assign(node.style, obj);
const wait = ms => new Promise(r => setTimeout(r, ms));

const card     = el('card-group');
const dot      = el('dot');
const okKey    = el('ok-key');
const scanLine = el('scan-line');
const chkG     = el('chk-circle');
const chkPath  = el('chk-path');
const label    = el('label');
const [r1,r2,r3] = [el('r1'),el('r2'),el('r3')];
const nfcArcs  = [el('n1'),el('n2'),el('n3')];
const sLines   = [el('sl1'),el('sl2'),el('sl3')];

/* ── animate element with Web Animations API ── */
function anim(node, frames, opts) {
  return node.animate(frames, { fill: 'forwards', composite: 'replace', ...opts }).finished;
}

/* ── status dot blink (runs forever) ── */
dot.animate([{opacity:1},{opacity:.2},{opacity:1}], { duration: 1200, iterations: Infinity });

/* ── screen lines draw-on on load ── */
async function drawScreenLines(on) {
  for (const ln of sLines) {
    ln.classList.toggle('draw', on);
    await wait(120);
  }
}

/* ── NFC arcs ── */
async function showNFC(on) {
  for (const a of nfcArcs) {
    a.classList.toggle('draw', on);
    if (on) await wait(100);
  }
}

/* ── ripple ── */
function ripple(node, delay) {
  wait(delay).then(() =>
    node.animate([
      { transform: 'scale(0)', opacity: .6 },
      { transform: 'scale(2.4)', opacity: 0 }
    ], { duration: 800, easing: 'cubic-bezier(0,0,.4,1)', fill: 'forwards' })
  );
}

/* ── scan line sweep ── */
async function scanSlot() {
  css(scanLine, { opacity: '1' });
  await scanLine.animate([
    { transform: 'translateX(0)' },
    { transform: 'translateX(110px)' }
  ], { duration: 600, easing: 'cubic-bezier(0.4,0,0.6,1)', fill: 'forwards' }).finished;
  css(scanLine, { opacity: '0' });
  scanLine.getAnimations().forEach(a => a.cancel());
}

/* ── OK key highlight ── */
async function flashOK() {
  await okKey.animate([
    { stroke: '#9ab3c7' },
    { stroke: '#5b8faa' },
    { stroke: '#9ab3c7' }
  ], { duration: 600, easing: 'ease-in-out', fill: 'forwards' }).finished;
}

/* ── checkmark draw-on ── */
async function showCheck(on) {
  if (on) {
    await anim(chkG, [
      { opacity: 0, transform: 'scale(0.5)' },
      { opacity: 1, transform: 'scale(1.08)', offset: 0.7 },
      { opacity: 1, transform: 'scale(1)' }
    ], { duration: 420, easing: 'cubic-bezier(0.34,1.36,0.64,1)' });

    await anim(chkPath, [
      { strokeDashoffset: 30 },
      { strokeDashoffset: 0 }
    ], { duration: 340, easing: 'cubic-bezier(0.4,0,0.2,1)' });
  } else {
    await anim(chkG, [
      { opacity: 1, transform: 'scale(1)' },
      { opacity: 0, transform: 'scale(0.8)' }
    ], { duration: 260, easing: 'ease-in' });
  }
}

/* ── label update ── */
async function setLabel(text) {
  css(label, { opacity: '0' });
  await wait(260);
  label.textContent = text;
  css(label, { opacity: '1' });
}

/* ── main loop ── */
async function run() {
  // reset
  css(card, { opacity: '0', transform: 'translateY(-130px)' });
  chkG.getAnimations().forEach(a => a.cancel()); css(chkG, { opacity: '0' });
  chkPath.getAnimations().forEach(a => a.cancel()); css(chkPath, { strokeDashoffset: '30' });
  for (const ln of sLines) ln.classList.remove('draw');
  await showNFC(false);
  css(scanLine, { opacity: '0' });
  scanLine.getAnimations().forEach(a => a.cancel()); css(scanLine, { transform: '' });
  for (const r of [r1,r2,r3]) r.getAnimations().forEach(a => a.cancel());

  await wait(300);

  // 1. screen lines appear
  setLabel('Insira o cartão');
  drawScreenLines(true);
  await wait(300);

  // 2. card slides in — gravity ease-in, soft settle at end
  css(card, { opacity: '1' });
  await anim(card, [
    { transform: 'translateY(-130px)', opacity: 0 },
    { transform: 'translateY(-130px)', opacity: 1,   offset: 0.04 },
    { transform: 'translateY(4px)',    opacity: 1,   offset: 0.88 },
    { transform: 'translateY(0px)',    opacity: 1 }
  ], { duration: 750, easing: 'cubic-bezier(0.4, 0, 0.6, 1)' });

  // 3. scan + NFC
  await wait(180);
  setLabel('Processando…');
  await Promise.all([scanSlot(), showNFC(true)]);
  await wait(200);

  // 4. OK key flash + ripples
  flashOK();
  ripple(r1, 0); ripple(r2, 220); ripple(r3, 440);
  await wait(300);

  // 5. checkmark
  await showCheck(true);
  setLabel('Pagamento aprovado!');
  await wait(1100);

  // 6. card slides out — ease-in-out pull
  await anim(card, [
    { transform: 'translateY(0px)',    opacity: 1 },
    { transform: 'translateY(-10px)',  opacity: 1,   offset: 0.1 },
    { transform: 'translateY(-130px)', opacity: 0 }
  ], { duration: 560, easing: 'cubic-bezier(0.4, 0, 0.2, 1)' });

  // 7. check fades
  await showCheck(false);

  await wait(500);
  run();
}

run();
</script>
</body>
</html>
